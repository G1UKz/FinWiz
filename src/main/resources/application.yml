spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finwiz
    username: finwiz
    password: finwiz
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

server:
  port: 8080

logging:
  level:
    finwiz.app: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:Zm9yLXRlc3Rpbmctb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 86400000  # 24 часа в мс